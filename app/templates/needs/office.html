{% extends "auth/home.html" %}
{% block content %}
<h1>{{ heading }}</h1>
<h2>困りごと</h2>
{% if can_write %}<p><a href="{{ url_for('needs.new', office_id=office.id) }}" role="button">困りごとを書く</a></p>{% endif %}
{% if items %}
<ul>
  {% for item in items %}
  <li><a href="{{ url_for('needs.detail', office_id=office.id, need_id=item.id) }}">{{ item.body | truncate(65) }}</a>（{{ statuses[item.status] }}）</li>
  {% endfor %}
</ul>
{% else %}<p>困りごとはまだありません。</p>{% endif %}
<form method="post" action="{{ url_for('auth.logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="secondary outline">ログアウト</button>
</form>
{% endblock %}
