{% extends "base.html" %}
{% block title %}守秘の誓約｜つなぐだけ{% endblock %}
{% block content %}
<p><a href="{{ url_for('auth.talent_home') }}">信用台帳に戻る</a></p>
<h1>守秘の誓約</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<ul>{% for term in terms %}<li>{{ term }}</li>{% endfor %}</ul>
<form method="post">
  {{ form.hidden_tag() }}
  <label>{{ form.agree(required=true) }} {{ form.agree.label.text }}</label>
  <button type="submit">署名する</button>
</form>
{% endblock %}
