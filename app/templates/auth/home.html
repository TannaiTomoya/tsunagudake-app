{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
{% if workspace_url and workspace_url != url_for('auth.account') %}
<p><a class="action" href="{{ workspace_url }}">担当のホームを開く</a></p>
{% endif %}
<p><a href="{{ url_for('messages.inbox') }}">メッセージ</a></p>
<form method="post" action="{{ url_for('auth.logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="secondary outline" type="submit">ログアウトする</button>
</form>
<p><a href="{{ url_for('accounts.withdraw_account') }}">退会する</a></p>
{% endblock %}
